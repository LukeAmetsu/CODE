<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoltória de Resistência M-N (NBR 6118)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Lógica de Tema Imediata para evitar o "flash"
        (function() {
            if (localStorage.getItem('theme') === 'dark' || 
               (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="../styles.min.css">
    <script src="../js/i18n.js" defer></script>
    <script src="../js/shared-utils.js" defer></script>
    <script src="../js/template.js" defer></script>
    <script src="../js/validation-rules.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-300">
    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <div id="header-placeholder" style="min-height: 110px;"></div>

        <main id="mn-calculator-form">
            <div class="space-y-8">
                <div>
                    <div class="form-section">
                        <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Parâmetros de Entrada</h2>
                        <form id="calcForm" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label for="b" class="block text-sm font-medium">Largura $b$ (cm)</label>
                                    <input type="number" id="b" value="25">
                                </div>
                                <div>
                                    <label for="h" class="block text-sm font-medium">Altura $h$ (cm)</label>
                                    <input type="number" id="h" value="60">
                                </div>
                                <div>
                                    <label for="d" class="block text-sm font-medium">Altura Útil $d$ (cm)</label>
                                    <input type="number" id="d" value="55">
                                </div>
                                <div>
                                    <label for="fck" class="block text-sm font-medium">Concreto $f_{ck}$ (MPa)</label>
                                    <input type="number" id="fck" value="25">
                                </div>
                                <div>
                                    <label for="fyk" class="block text-sm font-medium">Aço $f_{yk}$ (MPa)</label>
                                    <input type="number" id="fyk" value="500">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label for="d_linha" class="block text-sm font-medium">Cobrimento $d'$ (cm)</label>
                                    <input type="number" id="d_linha" value="5">
                                </div>
                                <div>
                                    <label for="As" class="block text-sm font-medium">Arm. Inf. $A_s$ (cm²)</label>
                                    <input type="number" id="As" value="12.56">
                                </div>
                                <div>
                                    <label for="As_linha" class="block text-sm font-medium">Arm. Sup. $A_s'$ (cm²)</label>
                                    <input type="number" id="As_linha" value="4.02">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label for="gamma_c" class="block text-sm font-medium">$\gamma_c$ (concreto)</label>
                                    <input type="number" id="gamma_c" value="1.4" step="0.1">
                                </div>
                                <div>
                                    <label for="gamma_s" class="block text-sm font-medium">$\gamma_s$ (aço)</label>
                                    <input type="number" id="gamma_s" value="1.15" step="0.01">
                                </div>
                            </div>
                        </form>
                    </div>
                     <div class="mt-8 flex justify-center">
                        <button type="submit" form="calcForm" id="run-check-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700">
                            Calcular Envoltória
                        </button>
                    </div>
                </div>
                <div class="form-section">
                    <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Resultados</h2>
                    <div class="flex justify-center">
                        <div id="chartContainer" class="mb-6" style="height: 50vh; width: 80%;">
                            <canvas id="mnChart"></canvas>
                        </div>
                    </div>
                    <h3 class="text-xl font-semibold mb-3 mt-6 text-center">Pontos Notáveis (Mrd, Nrd)</h3>
                    <div id="resultsTableContainer" class="overflow-x-auto max-w-3xl mx-auto">
                        <p id="resultsPlaceholder" class="text-[var(--color-text-secondary)] text-center">Insira os dados e clique em "Calcular" para ver os resultados.</p>
                    </div>
                </div>
            </div>
        </main>

        <div id="feedback-message" class="text-center mt-2 text-sm h-5"></div>
        <div id="results-container" class="mt-10 results-container"></div>
        <div id="footer-placeholder"></div>
    </div>

    <script src="M-N.js"></script>
</body>
</html>
