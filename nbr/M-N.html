<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoltória de Resistência M-N (NBR 6118)</title>
    <link rel="stylesheet" href="../styles.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="header-placeholder"></div>
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl">
                <div class="grid md:grid-cols-2 gap-8">
                    <div>
                        <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-200 mb-4 border-b pb-2">Parâmetros de Entrada</h2>
                        <form id="calcForm" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label for="b" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Largura $b$ (cm)</label>
                                    <input type="number" id="b" value="25" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <div>
                                    <label for="h" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Altura $h$ (cm)</label>
                                    <input type="number" id="h" value="60" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label for="fck" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Concreto $f_{ck}$ (MPa)</label>
                                    <input type="number" id="fck" value="25" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <div>
                                    <label for="fyk" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Aço $f_{yk}$ (MPa)</label>
                                    <input type="number" id="fyk" value="500" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-4">
                                <div>
                                    <label for="d_linha" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Cobrimento $d'$ (cm)</label>
                                    <input type="number" id="d_linha" value="5" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <div>
                                    <label for="As" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Arm. Inf. $A_s$ (cm²)</label>
                                    <input type="number" id="As" value="12.56" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <div>
                                    <label for="As_linha" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Arm. Sup. $A_s'$ (cm²)</label>
                                    <input type="number" id="As_linha" value="4.02" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label for="gamma_c" class="block text-sm font-medium text-gray-700 dark:text-gray-300">$\gamma_c$ (concreto)</label>
                                    <input type="number" id="gamma_c" value="1.4" step="0.1" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                                <div>
                                    <label for="gamma_s" class="block text-sm font-medium text-gray-700 dark:text-gray-300">$\gamma_s$ (aço)</label>
                                    <input type="number" id="gamma_s" value="1.15" step="0.01" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                </div>
                            </div>
                            <button type="submit" id="run-check-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-150 ease-in-out">
                                Calcular Envoltória
                            </button>
                        </form>
                    </div>
                    <div id="results-container">
                        <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-200 mb-4 border-b pb-2">Resultados</h2>
                        <div id="chartContainer" class="mb-6" style="height: 40vh; width: 100%;">
                            <canvas id="mnChart"></canvas>
                        </div>
                        <h3 class="text-xl font-semibold text-gray-700 dark:text-gray-300 mb-3">Pontos Notáveis (Mrd, Nrd)</h3>
                        <div id="resultsTableContainer" class="overflow-x-auto">
                            <p id="resultsPlaceholder" class="text-gray-500 dark:text-gray-400">Insira os dados e clique em "Calcular" para ver os resultados.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>

    <script src="../js/i18n.js"></script>
    <script src="../js/shared-utils.js"></script>
    <script src="../js/validation-rules.js"></script>
    <script src="../js/template.js"></script>
    <script src="M-N.js"></script>
</body>
</html>
