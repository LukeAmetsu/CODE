<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pcalc_title">PCalc - Concrete Column Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Immediate theme application
        (function() {
            if (localStorage.getItem('theme') === 'dark' || 
               (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="../styles.min.css">
    <script src="../js/i18n.js" defer></script>
    <script src="../js/shared-utils.js" defer></script>
    <script src="../js/template.js" defer></script>
    <script src="PCALC.js" defer></script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-300">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <div id="header-placeholder" style="min-height: 110px;"></div>

        <main id="pcalc-app" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Left Panel: Inputs -->
            <div class="flex flex-col gap-6">
                <div class="form-section">
                    <h2 class="text-xl font-bold mb-4" data-i18n="pcalc_section_geometry">Section Geometry</h2>
                    <form id="geometry-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="section-type" class="block text-sm font-medium mb-1" data-i18n="pcalc_section_type">Section Type</label>
                            <select id="section-type" name="section-type">
                                <option value="Retangular">Rectangular</option>
                                <option value="Circular">Circular</option>
                            </select>
                        </div>
                        <div><label for="hx" class="block text-sm font-medium mb-1">hx (cm)</label><input type="number" id="hx" name="hx" value="30"></div>
                        <div><label for="hy" class="block text-sm font-medium mb-1">hy (cm)</label><input type="number" id="hy" name="hy" value="50"></div>
                    </form>
                </div>

                <div class="form-section">
                    <h2 class="text-xl font-bold mb-4" data-i18n="pcalc_materials">Materials</h2>
                    <form id="materials-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div><label for="fck" class="block text-sm font-medium mb-1">fck (MPa)</label><input type="number" id="fck" name="fck" value="25"></div>
                    </form>
                </div>

                <div class="form-section">
                    <h2 class="text-xl font-bold mb-4" data-i18n="pcalc_reinforcement">Reinforcement</h2>
                    <form id="reinforcement-form">
                        <div class="overflow-x-auto">
                            <table id="reinforcement-table" class="w-full text-sm text-left">
                                <thead>
                                    <tr>
                                        <th class="px-4 py-2">x (cm)</th>
                                        <th class="px-4 py-2">y (cm)</th>
                                        <th class="px-4 py-2">Diameter (mm)</th>
                                        <th class="px-4 py-2"></th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                        <button type="button" id="add-bar-btn" class="mt-4" data-i18n="pcalc_add_bar">+ Add Bar</button>
                    </form>
                </div>

                <div class="form-section">
                    <h2 class="text-xl font-bold mb-4" data-i18n="pcalc_loads">Factored Loads</h2>
                    <form id="loads-form">
                        <div class="overflow-x-auto">
                            <table id="loads-table" class="w-full text-sm text-left">
                                <thead>
                                    <tr>
                                        <th class="px-4 py-2">N (kN)</th>
                                        <th class="px-4 py-2">Mx (kNm)</th>
                                        <th class="px-4 py-2">My (kNm)</th>
                                        <th class="px-4 py-2"></th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                        <button type="button" id="add-load-btn" class="mt-4" data-i18n="pcalc_add_load">+ Add Load</button>
                    </form>
                </div>
                 <div class="form-section">
                    <h2 class="text-xl font-bold mb-4" data-i18n="pcalc_config">Calculation Settings</h2>
                    <!-- Add settings inputs here if needed -->
                </div>

                <div class="flex justify-center items-center gap-4 mt-4">
                    <button id="calculate-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700" data-i18n="pcalc_calculate">Calculate</button>
                    <button id="pdf-btn" class="bg-red-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-red-700">Generate PDF</button>
                </div>
            </div>

            <!-- Right Panel: Results -->
            <div class="flex flex-col gap-6">
                <div class="form-section">
                    <h2 class="text-xl font-bold mb-4" data-i18n="pcalc_cross_section">Cross Section</h2>
                    <div id="cross-section-canvas" class="min-h-[300px] bg-gray-100 dark:bg-gray-800 rounded-md"></div>
                </div>
                <div class="form-section">
                    <h2 class="text-xl font-bold mb-4">Results</h2>
                    <div class="flex flex-wrap items-center gap-4 mb-4">
                        <button id="nmxmy-btn" class="text-sm font-medium">N-Mx-My</button>
                        <button id="nmx-btn" class="text-sm font-medium">N-Mx</button>
                        <button id="nmy-btn" class="text-sm font-medium">N-My</button>
                    </div>
                    <div class="relative h-96">
                        <canvas id="myChart"></canvas>
                    </div>
                    <div class="mt-6 overflow-x-auto">
                        <table id="results-table" class="w-full text-sm text-left">
                            <thead>
                                <tr>
                                    <th class="px-4 py-2">Comb.</th>
                                    <th class="px-4 py-2">Nsd (kN)</th>
                                    <th class="px-4 py-2">Msd,x (kNm)</th>
                                    <th class="px-4 py-2">Msd,y (kNm)</th>
                                    <th class="px-4 py-2">F.S.</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>
</body>
</html>
