<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pcalc_title">PCalc - Concrete Column Checker</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Theme Script -->
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark' || 
               (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- Local Project Dependencies -->
    <link rel="stylesheet" href="../styles.min.css">
    <script src="../js/i18n.js" defer></script>
    <script src="../js/shared-utils.js" defer></script>
    <script src="../js/template.js" defer></script>
    <script src="../js/validation-rules.js" defer></script>
    
    <style>
        /* Fallback if styles.min.css is missing or loading late */
        .table-container::-webkit-scrollbar { height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-container::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-300 flex flex-col">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl flex-grow">
        <!-- Header Placeholder for template.js -->
        <div id="header-placeholder" style="min-height: 80px;"></div>

        <main id="pcalc-app" class="grid grid-cols-1 lg:grid-cols-2 gap-8 mt-6">
            <!-- Left Panel: Inputs -->
            <div class="flex flex-col gap-6">
                <!-- Geometry -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4 text-slate-800 dark:text-white border-b dark:border-gray-700 pb-2">Section Geometry</h2>
                    <form id="geometry-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="section-type" class="block text-sm font-medium mb-1 text-gray-600 dark:text-gray-400">Section Type</label>
                            <select id="section-type" name="section-type" class="w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm p-2 border focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white">
                                <option value="Retangular">Rectangular</option>
                                <option value="Circular">Circular</option>
                            </select>
                        </div>
                        <div>
                            <label for="hx" class="block text-sm font-medium mb-1 text-gray-600 dark:text-gray-400">hx (cm)</label>
                            <input type="number" id="hx" name="hx" value="30" class="w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm p-2 border focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white">
                        </div>
                        <div>
                            <label for="hy" class="block text-sm font-medium mb-1 text-gray-600 dark:text-gray-400">hy (cm)</label>
                            <input type="number" id="hy" name="hy" value="50" class="w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm p-2 border focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white">
                        </div>
                    </form>
                </div>

                <!-- Materials -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4 text-slate-800 dark:text-white border-b dark:border-gray-700 pb-2">Materials</h2>
                    <form id="materials-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="fck" class="block text-sm font-medium mb-1 text-gray-600 dark:text-gray-400">fck (MPa)</label>
                            <input type="number" id="fck" name="fck" value="25" class="w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm p-2 border focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white">
                        </div>
                    </form>
                </div>

                <!-- Reinforcement -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4 text-slate-800 dark:text-white border-b dark:border-gray-700 pb-2">Reinforcement</h2>
                    <form id="reinforcement-form">
                        <div class="overflow-x-auto table-container">
                            <table id="reinforcement-table" class="w-full text-sm text-left text-gray-700 dark:text-gray-300">
                                <thead class="bg-gray-100 dark:bg-gray-700">
                                    <tr>
                                        <th class="px-4 py-2 rounded-tl-lg">x (cm)</th>
                                        <th class="px-4 py-2">y (cm)</th>
                                        <th class="px-4 py-2">Diameter (mm)</th>
                                        <th class="px-4 py-2 rounded-tr-lg"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Rows added via JS -->
                                </tbody>
                            </table>
                        </div>
                        <button type="button" id="add-bar-btn" class="mt-4 flex items-center gap-1 text-blue-600 hover:text-blue-500 font-medium transition-colors">
                            <span class="text-lg">+</span> Add Bar
                        </button>
                    </form>
                </div>

                <!-- Loads -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4 text-slate-800 dark:text-white border-b dark:border-gray-700 pb-2">Factored Loads</h2>
                    <form id="loads-form">
                        <div class="overflow-x-auto table-container">
                            <table id="loads-table" class="w-full text-sm text-left text-gray-700 dark:text-gray-300">
                                <thead class="bg-gray-100 dark:bg-gray-700">
                                    <tr>
                                        <th class="px-4 py-2 rounded-tl-lg">N (kN)</th>
                                        <th class="px-4 py-2">Mx (kNm)</th>
                                        <th class="px-4 py-2">My (kNm)</th>
                                        <th class="px-4 py-2 rounded-tr-lg"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Rows added via JS -->
                                </tbody>
                            </table>
                        </div>
                        <button type="button" id="add-load-btn" class="mt-4 flex items-center gap-1 text-blue-600 hover:text-blue-500 font-medium transition-colors">
                            <span class="text-lg">+</span> Add Load
                        </button>
                    </form>
                </div>

                <!-- Feedback Message Container -->
                <div id="feedback-message" class="text-center h-5 text-sm font-medium transition-all"></div>

                <!-- Actions -->
                <div class="flex flex-wrap justify-center items-center gap-4 mt-4 pb-8">
                    <button id="calculate-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition-colors shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 dark:bg-blue-700 dark:hover:bg-blue-600">Calculate</button>
                </div>
            </div>

            <!-- Right Panel: Results -->
            <div class="flex flex-col gap-6">
                
                <!-- Cross Section Canvas -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4 text-slate-800 dark:text-white border-b dark:border-gray-700 pb-2">Cross Section Visualization</h2>
                    <div id="cross-section-container" class="w-full h-[300px] bg-gray-50 dark:bg-gray-900 rounded-md border border-gray-200 dark:border-gray-700 flex items-center justify-center overflow-hidden relative">
                        <canvas id="sectionCanvas"></canvas>
                        <div id="canvas-placeholder" class="absolute text-gray-400">Click Calculate to View Section</div>
                    </div>
                </div>

                <!-- Interaction Diagram -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4 text-slate-800 dark:text-white border-b dark:border-gray-700 pb-2">Interaction Diagram</h2>
                    <div class="flex flex-wrap items-center gap-2 mb-4">
                        <button id="nmxmy-btn" class="px-3 py-1 text-xs font-semibold uppercase tracking-wider bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors border dark:border-gray-600">N-Mx-My</button>
                        <button id="nmx-btn" class="px-3 py-1 text-xs font-semibold uppercase tracking-wider bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors border dark:border-gray-600">N-Mx</button>
                        <button id="nmy-btn" class="px-3 py-1 text-xs font-semibold uppercase tracking-wider bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors border dark:border-gray-600">N-My</button>
                    </div>
                    <div class="relative h-80 w-full">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>

                <!-- Results Table -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
                    <h3 class="text-xl font-bold mb-4 text-slate-800 dark:text-white border-b dark:border-gray-700 pb-2">Calculation Results</h3>
                    <div class="overflow-x-auto table-container">
                        <table id="results-table" class="w-full text-sm text-left text-gray-700 dark:text-gray-300">
                            <thead class="bg-gray-100 dark:bg-gray-700">
                                <tr>
                                    <th class="px-4 py-2 rounded-tl-lg">Comb.</th>
                                    <th class="px-4 py-2">Nsd (kN)</th>
                                    <th class="px-4 py-2">Msd,x (kNm)</th>
                                    <th class="px-4 py-2">Msd,y (kNm)</th>
                                    <th class="px-4 py-2 rounded-tr-lg">Status</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer Placeholder for template.js -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Main Application Logic -->
    <script src="PCALC.js"></script>
</body>
</html>
