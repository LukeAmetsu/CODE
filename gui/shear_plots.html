<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="shear_plots_generator">Shear Plots Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            if (localStorage.getItem('theme') === 'dark' ||
                (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.min.css">
    <script type="text/javascript" src="/eel.js"></script>
    <script src="../js/i18n.js" defer></script>
    <script src="../js/shared-utils.js" defer></script>
    <script src="../js/template.js" defer></script>
    <script src="shear_plots.js" defer></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof injectHeader === 'function') {
                injectHeader({
                    activePage: 'shear_plots',
                    pageTitle: 'shear_plots_generator',
                    headerPlaceholderId: 'header-placeholder',
                    pathPrefix: '../'
                });
            }
            if (typeof injectFooter === 'function') {
                injectFooter({
                    footerPlaceholderId: 'footer-placeholder',
                    pathPrefix: '../'
                });
            }
        });
    </script>
</head>
<body>
    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <div id="header-placeholder" style="min-height: 110px;"></div>

        <main>
            <div class="form-section mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-[var(--color-text-primary)]" data-i18n="shear_plots_title">Shear Plots Generation</h2>
                    <button id="btn-generate" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
                        Start Generation
                    </button>
                </div>
                
                <p class="text-[var(--color-text-secondary)] mb-6">
                    Click the button above to regenerate all 126 shear plot graphs. The progress will be displayed below, and images will appear as they are saved to the <code class="bg-[var(--color-bg-tertiary)] px-1 rounded">/plots/</code> directory.
                </p>

                <!-- Progress Section (Hidden initially) -->
                <div id="progress-container" class="hidden">
                    <div class="flex justify-between text-sm mb-2 text-[var(--color-text-secondary)]">
                        <span id="progress-status">Initializing...</span>
                        <span id="progress-percentage">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6 dark:bg-gray-700 overflow-hidden">
                        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Plots Gallery -->
            <div class="form-section">
                <h3 class="text-xl font-bold text-[var(--color-text-primary)] mb-6" data-i18n="generated_plots">Generated Plots</h3>
                
                <div id="plots-gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Images will be injected here via JS -->
                </div>
                
                <div id="empty-state" class="text-center py-12 text-[var(--color-text-secondary)]">
                    <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p>No plots generated yet. Click "Start Generation" to begin.</p>
                </div>
            </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>
</body>
</html>
