<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Weld Group Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.min.css">
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script type="text/javascript" src="/eel.js"></script>
    <script src="../js/i18n.js" defer></script>
    <script src="../js/shared-utils.js" defer></script>
    <script src="../js/template.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof injectHeader === 'function') {
                injectHeader({
                    activePage: 'weld_group',
                    pageTitle: '3D Weld Group Calculator',
                    headerPlaceholderId: 'header-placeholder',
                    pathPrefix: '../'
                });
            }
            if (typeof injectFooter === 'function') {
                injectFooter({
                    footerPlaceholderId: 'footer-placeholder',
                    pathPrefix: '../'
                });
            }
        });
    </script>
    <style>
        .canvas-container {
            position: relative;
            width: 100%;
            padding-bottom: 75%; /* 4:3 Aspect Ratio */
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border-primary);
        }
        #weldCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-[var(--color-bg-primary)] text-[var(--color-text-primary)] transition-colors duration-200">
    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <div id="header-placeholder" style="min-height: 110px;"></div>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Inputs -->
            <div class="lg:col-span-5 space-y-6">
                
                <div class="form-section">
                    <div class="flex items-center justify-between border-b border-[var(--color-border-primary)] pb-2 mb-4">
                        <h2 class="text-xl font-bold">Applied Loads</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label>Fx</label>
                            <input type="number" id="load_fx" value="0" step="any">
                        </div>
                        <div class="input-group">
                            <label>Mx</label>
                            <input type="number" id="load_mx" value="0" step="any">
                        </div>
                        <div class="input-group">
                            <label>Fy</label>
                            <input type="number" id="load_fy" value="10" step="any">
                        </div>
                        <div class="input-group">
                            <label>My</label>
                            <input type="number" id="load_my" value="0" step="any">
                        </div>
                        <div class="input-group">
                            <label>Fz</label>
                            <input type="number" id="load_fz" value="0" step="any">
                        </div>
                        <div class="input-group">
                            <label>Mz</label>
                            <input type="number" id="load_mz" value="0" step="any">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-[var(--color-border-primary)]">
                        <div class="input-group">
                            <label>Load Pos X</label>
                            <input type="number" id="load_px" value="5" step="any">
                        </div>
                        <div class="input-group">
                            <label>Load Pos Y</label>
                            <input type="number" id="load_py" value="0" step="any">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="flex justify-between items-center border-b border-[var(--color-border-primary)] pb-2 mb-4">
                        <h2 class="text-xl font-bold">Weld Segments</h2>
                        <button id="addSegmentBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded text-sm transition-colors">+ Add Segment</button>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs uppercase bg-[var(--color-bg-secondary)] text-[var(--color-text-secondary)]">
                                <tr>
                                    <th class="px-2 py-2">X1</th>
                                    <th class="px-2 py-2">Y1</th>
                                    <th class="px-2 py-2">X2</th>
                                    <th class="px-2 py-2">Y2</th>
                                    <th class="px-2 py-2">Size (a)</th>
                                    <th class="px-2 py-2">Act</th>
                                </tr>
                            </thead>
                            <tbody id="segmentsTableBody">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <button id="calculateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-lg shadow-lg">Calculate Stresses</button>
            </div>

            <!-- Right Column: Visualization and Results -->
            <div class="lg:col-span-7 space-y-6">
                
                <div class="form-section">
                    <h2 class="text-xl font-bold border-b border-[var(--color-border-primary)] pb-2 mb-4">Visualization</h2>
                    <div class="canvas-container shadow-inner">
                        <canvas id="weldCanvas"></canvas>
                    </div>
                </div>

                <div id="resultsSection" class="form-section hidden">
                    <h2 class="text-xl font-bold border-b border-[var(--color-border-primary)] pb-2 mb-4 text-green-600 dark:text-green-400">Results</h2>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div class="bg-[var(--color-bg-primary)] p-3 rounded border border-[var(--color-border-primary)]">
                            <div class="text-xs text-[var(--color-text-secondary)]">Total Area</div>
                            <div class="font-bold text-lg" id="res_area">-</div>
                        </div>
                        <div class="bg-[var(--color-bg-primary)] p-3 rounded border border-[var(--color-border-primary)]">
                            <div class="text-xs text-[var(--color-text-secondary)]">Centroid (X,Y)</div>
                            <div class="font-bold text-lg" id="res_centroid">-</div>
                        </div>
                        <div class="bg-[var(--color-bg-primary)] p-3 rounded border border-[var(--color-border-primary)]">
                            <div class="text-xs text-[var(--color-text-secondary)]">Polar Inertia (Jz)</div>
                            <div class="font-bold text-lg" id="res_jz">-</div>
                        </div>
                        <div class="bg-[var(--color-bg-primary)] p-3 rounded border border-red-500 bg-red-50 dark:bg-red-900/20">
                            <div class="text-xs text-red-600 dark:text-red-400 font-bold">Max Resultant Stress</div>
                            <div class="font-bold text-2xl text-red-600 dark:text-red-400" id="res_max_stress">-</div>
                        </div>
                    </div>

                    <div class="overflow-x-auto border rounded border-[var(--color-border-primary)]">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs uppercase bg-[var(--color-bg-secondary)] text-[var(--color-text-secondary)]">
                                <tr>
                                    <th class="px-3 py-2">Point</th>
                                    <th class="px-3 py-2">X</th>
                                    <th class="px-3 py-2">Y</th>
                                    <th class="px-3 py-2">fx</th>
                                    <th class="px-3 py-2">fy</th>
                                    <th class="px-3 py-2">fz</th>
                                    <th class="px-3 py-2 font-bold text-[var(--color-text-primary)]">f_res</th>
                                </tr>
                            </thead>
                            <tbody id="stressTableBody" class="divide-y divide-[var(--color-border-primary)]">
                                <!-- Results rows -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="errorSection" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded hidden mb-6" role="alert">
                    <p class="font-bold">Error</p>
                    <p id="errorMessage"></p>
                </div>

            </div>

        </main>
        <div id="footer-placeholder"></div>
    </div>

    <script src="weld_group.js"></script>
</body>
</html>
