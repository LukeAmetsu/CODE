<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Strut & Tie Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babylon.js for 3D Visualization -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.min.css">
    
    <!-- Shared Utils -->
    <script type="text/javascript" src="/eel.js"></script>
    <script src="../js/i18n.js" defer></script>
    <script src="../js/shared-utils.js" defer></script>
    <script src="../js/template.js" defer></script>
    <!-- Page Specific Script -->
    <script src="STM_LOGIC.js" defer></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans">

    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <div id="header-placeholder" style="min-height: 110px;"></div>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Inputs -->
            <div class="lg:col-span-1 space-y-6">
                
                <!-- Project Settings -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md border-l-4 border-blue-600">
                    <h2 class="text-xl font-bold mb-4">Settings</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Concrete Strength (f'c) [ksi]</label>
                            <input type="number" id="fc" value="4" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Steel Strength (fy) [ksi]</label>
                            <input type="number" id="fy" value="60" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        </div>
                        <!-- Status Removed -->

                    </div>
                </div>

                <!-- Nodes Input -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-xl font-bold">Nodes</h2>
                        <button id="add-node-btn" class="text-sm bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 px-2 py-1 rounded">+ Add</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left" id="nodes-table">
                            <thead class="bg-gray-100 dark:bg-gray-700">
                                <tr>
                                    <th class="p-2">ID</th>
                                    <th class="p-2">X</th>
                                    <th class="p-2">Y</th>
                                    <th class="p-2">Z</th>
                                    <th class="p-2">Fix?</th>
                                    <th class="p-2">Load(Y)</th>
                                    <th class="p-2"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">* Fix: check to pin node (support). Load is vertical (kips).</p>
                </div>

                <!-- Members Input -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-xl font-bold">Members</h2>
                        <button id="add-member-btn" class="text-sm bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 px-2 py-1 rounded">+ Add</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left" id="members-table">
                            <thead class="bg-gray-100 dark:bg-gray-700">
                                <tr>
                                    <th class="p-2">Start</th>
                                    <th class="p-2">End</th>
                                    <th class="p-2">Type</th>
                                    <th class="p-2"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <button id="run-stm-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg">
                    Calculate (Python) & Visualize
                </button>
                
                <div id="feedback-message" class="hidden text-center font-medium mt-2"></div>
            </div>

            <!-- Right Column: Visualization & Results -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 3D Canvas -->
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md h-[500px] flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                         <h3 class="font-bold text-gray-700 dark:text-gray-300">3D Visualization</h3>
                         <span class="text-xs text-gray-500">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</span>
                    </div>
                    <canvas id="renderCanvas" class="w-full flex-grow outline-none touch-none"></canvas>
                </div>

                <!-- Report Output -->
                <div id="stm-results-container"></div>
            </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>
</body>
</html>
