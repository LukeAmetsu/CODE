<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="engineering_hub">Engineering Calculator Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Lógica de Tema Imediata para evitar o "flash"
        (function() {
            if (localStorage.getItem('theme') === 'dark' || 
               (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.min.css">
    <script src="js/i18n.js" defer></script>
    <script src="js/shared-utils.js" defer></script>
    <script src="js/template.js" defer></script>
</head>
<body>

    <div class="container mx-auto p-4 md:p-8 max-w-5xl">
        <div id="header-placeholder" style="min-height: 110px;"></div>

        <main>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-12 gap-y-8">
                <!-- US Codes Section -->
                <div class="flex flex-col">
                    <h2 class="text-2xl font-bold border-b-2 border-[var(--color-border-primary)] pb-2 mb-6" data-i18n="us_codes">US Codes</h2>
                    <div class="flex-grow grid grid-auto-rows-fr gap-y-9" id="us-codes-container">
                        <!-- ASCE Loads Card -->
                        <div class="form-section flex flex-col group">
                            <div class="flex items-center mb-3">
                                <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="asce_loads"></h3>
                            </div>
                            <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="asce_desc"></p>
                            <a href="asce/wind.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_load_calcs"></a>
                        </div>

                        <!-- AISC Steel Card -->
                        <div class="form-section flex flex-col group">
                            <div class="flex items-center mb-3">
                                <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="aisc_steel"></h3>
                            </div>
                            <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="aisc_desc"></p>
                            <a href="aisc/steel check.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_steel_design"></a>
                        </div>

                        <!-- AISC Base Plate Card -->
                        <div class="form-section flex flex-col group">
                            <div class="flex items-center mb-3">
                                <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="base_plate"></h3>
                            </div>
                            <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="base_plate_desc"></p>
                            <a href="aisc/base plate.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_steel_design"></a>
                        </div>

                        <!-- AISC Splice Card -->
                        <div class="form-section flex flex-col group">
                            <div class="flex items-center mb-3">
                                <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="splice"></h3>
                            </div>
                            <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="splice_desc"></p>
                            <a href="aisc/splice.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_steel_design"></a>
                        </div>

                        <!-- NDS Wood Card -->
                        <div class="form-section flex flex-col group">
                            <div class="flex items-center mb-3">
                                <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="nds_wood"></h3>
                            </div>
                            <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="nds_desc"></p>
                            <a href="nds/nds wood design.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_wood_design"></a>
                        </div>

                        <!-- ACI Concrete Card -->
                        <div class="form-section flex flex-col group">
                            <div class="flex items-center mb-3">
                                <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="aci_concrete"></h3>
                            </div>
                            <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="aci_desc"></p>
                            <a href="aci/aci 318 concrete.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_concrete_design"></a>
                        </div>
                    </div>
                </div>

                <!-- Brazilian Codes (NBR) Section -->
                <div class="flex flex-col">
                    <h2 class="text-2xl font-bold border-b-2 border-[var(--color-border-primary)] pb-2 mb-6" data-i18n="brazilian_codes"></h2>
                    <div class="flex-grow grid grid-auto-rows-fr gap-y-9" id="nbr-codes-container">
                    <!-- NBR Combinations Card -->
                    <div class="form-section flex flex-col group">
                        <div class="flex items-center mb-3">
                            <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="nbr_combos"></h3>
                        </div>
                        <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="nbr_combos_desc"></p>
                        <a href="nbr/comb nbr 6118.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_nbr_combos">
                        </a>
                    </div>
                    <!-- NBR 6118 Concrete Card -->
                    <div class="form-section flex flex-col group">
                        <div class="flex items-center mb-3">
                            <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="nbr_concrete"></h3>
                        </div>
                        <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="nbr_concrete_desc"></p>
                        <a href="nbr/nbr 6118 concreto.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_concrete_checker">
                        </a>
                    </div>
                    <!-- NBR 6118 Prestressed Beam Card -->
                    <div class="form-section flex flex-col group">
                        <div class="flex items-center mb-3">
                            <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="nbr_prestressed"></h3>
                        </div>
                        <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="nbr_prestressed_desc"></p>
                        <a href="nbr/viga_protendida.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_prestressed_beam">
                        </a>
                    </div>
                    <!-- NBR 7190 Wood Card -->
                    <div class="form-section flex flex-col group">
                        <div class="flex items-center mb-3">
                            <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="nbr_wood"></h3>
                        </div>
                        <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="nbr_wood_desc"></p>
                        <a href="nbr/nbr 7190 madeira.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_wood_checker">
                        </a>
                    </div>
                    <!-- NBR 8800 Steel Card -->
                    <div class="form-section flex flex-col group">
                        <div class="flex items-center mb-3">
                            <h3 class="text-xl font-bold text-[var(--color-text-primary)] ml-3" data-i18n="nbr_steel"></h3>
                        </div>
                        <p class="text-[var(--color-text-secondary)] mb-6 flex-grow" data-i18n="nbr_steel_desc"></p>
                        <a href="nbr/nbr 8080 estruturas de aço.html" class="mt-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 text-center transition-colors self-start" data-i18n="go_to_steel_checker">
                            </a>
                    </div>
                </div>
            </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>
</body>
</html>
