<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACI 318 Concrete Beam Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Lógica de Tema Imediata para evitar o "flash"
        (function() {
            if (localStorage.getItem('theme') === 'dark' || 
               (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="../styles.min.css">
    <script src="../js/i18n.js" defer></script>
    <script src="../js/shared-utils.js" defer></script>
    <script src="../js/template.js" defer></script>
    <script src="../js/validation-rules.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-300">
    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <div id="header-placeholder" style="min-height: 110px;"></div>

        <main id="aci-form">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div>
                    <div class="form-section">
                        <h2 data-i18n="material_properties"></h2>
                        <div class="space-y-4">
                            <div>
                                <label for="fc" class="block text-sm font-medium mb-1" data-i18n="concrete_strength_fc_psi"></label>
                                <input type="number" id="fc" value="4000">
                            </div>
                            <div>
                                <label for="fy" class="block text-sm font-medium mb-1" data-i18n="steel_yield_strength_fy_psi"></label>
                                <input type="number" id="fy" value="60000">
                            </div>
                        </div>
                    </div>
                    <div class="form-section">
                        <h2 data-i18n="beam_geometry"></h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label for="b" class="block text-sm" data-i18n="width_b_in"></label><input type="number" id="b" value="12"></div>
                            <div><label for="h" class="block text-sm" data-i18n="height_h_in"></label><input type="number" id="h" value="24"></div>
                            <div><label for="cover" class="block text-sm" data-i18n="cover_in"></label><input type="number" id="cover" value="1.5"></div>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="form-section">
                        <h2 data-i18n="flexural_reinforcement"></h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label for="num_bars" class="block text-sm" data-i18n="no_of_bars"></label><input type="number" id="num_bars" value="3"></div>
                            <div><label for="bar_size" class="block text-sm" data-i18n="bar_size_num"></label><input type="number" id="bar_size" value="8"></div>
                        </div>
                    </div>
                    <div class="form-section">
                        <h2 data-i18n="shear_reinforcement"></h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label for="stirrup_size" class="block text-sm" data-i18n="stirrup_size_num"></label><input type="number" id="stirrup_size" value="3"></div>
                            <div><label for="stirrup_legs" class="block text-sm" data-i18n="no_of_legs"></label><input type="number" id="stirrup_legs" value="2"></div>
                            <div><label for="stirrup_spacing" class="block text-sm" data-i18n="spacing_s_in"></label><input type="number" id="stirrup_spacing" value="10"></div>
                        </div>
                    </div>
                    <div class="form-section">
                        <h2 data-i18n="factored_loads_lrfd"></h2>
                        <div class="space-y-4">
                            <div>
                                <label for="Mu" class="block text-sm font-medium mb-1" data-i18n="moment_mu_kip_ft"></label>
                                <input type="number" id="Mu" value="150">
                            </div>
                            <div>
                                <label for="Vu" class="block text-sm font-medium mb-1" data-i18n="shear_vu_kips"></label>
                                <input type="number" id="Vu" value="30">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div class="form-section">
                        <h2 data-i18n="about_this_calculator"></h2>
                        <p class="text-sm text-[var(--color-text-secondary)]" data-i18n="aci_318_about_desc"></p>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-center">
                <button id="load-inputs-btn" class="bg-gray-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-gray-600 mr-4" data-i18n="load_inputs"></button>
                <button id="save-inputs-btn" class="bg-green-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-700 mr-4" data-i18n="save_inputs"></button>
                <button id="run-check-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700" data-i18n="run_check"></button>
                <input type="file" id="file-input" class="hidden" accept=".txt,.json">
            </div>
        </main>

        <div id="feedback-message" class="text-center mt-2 text-sm h-5"></div>
        <div id="results-container" class="mt-10 results-container"></div>
        <div id="footer-placeholder"></div>
    </div>

</body>
</html>
